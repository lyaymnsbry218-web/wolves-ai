name: data-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch prices
        env:
          RAW: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          K=$(printf '%s' "$RAW" | tr -cd 'A-Za-z0-9')
          echo "key length: ${#K}"
          for S in XAU/USD XAG/USD; do
            echo "$S:"
            curl -sS -G "https://api.twelvedata.com/price" --data-urlencode "symbol=$S" --data-urlencode "apikey=$K" || true
            echo
          done
          echo "BTCUSDT:"
          curl -sS "https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT" || true
          echo
